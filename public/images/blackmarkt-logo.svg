<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 32" width="220" height="32" fill="none">
  <defs>
    <linearGradient id="bmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7C11" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
  </defs>

  <!-- Emblem / Crest -->
  <g transform="translate(2, 2)">
    <!-- Hexagonal Diamond Shield -->
    <polygon points="14,1 26,7.5 26,20.5 14,27 2,20.5 2,7.5" fill="#0F0F16" stroke="url(#bmGold)" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Inner Crosshair Grid -->
    <line x1="14" y1="3" x2="14" y2="25" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.6" />
    <line x1="4" y1="14" x2="24" y2="14" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.6" />
    <!-- Stylized 'B' & 'M' monogram glyph -->
    <path d="M10,8 L10,20 M10,8 Q15,8 15,11 Q15,14 10,14 M10,14 Q16,14 16,17 Q16,20 10,20" stroke="#FBFAE8" stroke-width="1.4" stroke-linecap="round" fill="none" />
    <path d="M14,11 L18,17 L22,8 L22,20" stroke="url(#bmGold)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <text x="36" y="16" font-family="'Clash Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="2.2" fill="#0F0F16">
    BLACK <tspan fill="#AA7C11">MARKT</tspan>
  </text>
  <text x="36.5" y="26" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="6.5" letter-spacing="2.4" fill="#6A5F52">
    NETWORK CONSULTANCY
  </text>
</svg>
